name: Tailscale Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  test:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build

  deploy:
    name: Deploy over Tailscale
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Show deployment metadata
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Time: $(date +'%Y-%m-%d %H:%M:%S %Z')"

      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.HOST_IP }}

      - name: Configure SSH client
        env:
          HOST_IP: ${{ secrets.HOST_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh-keyscan -T 30 -H "$HOST_IP" >> ~/.ssh/known_hosts

      - name: Deploy on server
        env:
          HOST_IP: ${{ secrets.HOST_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${HOST_IP}" <<'EOF'
          set -euo pipefail

          if [ -d "$HOME/fifa-dev" ]; then
            PROJECT_PATH="$HOME/fifa-dev"
          elif [ -d "$HOME/introduction-myself" ]; then
            PROJECT_PATH="$HOME/introduction-myself"
          else
            echo "Project directory not found. Expected $HOME/fifa-dev or $HOME/introduction-myself." >&2
            exit 1
          fi

          cd "$PROJECT_PATH"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          ufw allow 3009/tcp || true

          docker compose down --remove-orphans || true
          docker rm -f fifa-dev || true
          docker images "fifa-dev" -q | xargs -r docker rmi -f

          docker compose up -d --build --force-recreate
          docker compose ps
          EOF
